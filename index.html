<script>
function sendOrder(){
let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let spec = document.getElementById("spec").value;

let items = [...document.querySelectorAll("input[type=checkbox]:checked")]
.map(x=>x.value).join(", ");

let msg = `Name: ${name}%0APhone: ${phone}%0AProducts: ${items}%0ASpec: ${spec}`;

window.open("https://wa.me/2348034001482?text="+msg);
}
